# Keep the notebook's internal digital microphone (Mic1) as the input.
monitor.alsa.rules = [
    {
        matches = [
            { node.name = "~^alsa_input[.]usb---_KTMicro_--_Audio_hs_2[.]0_headset_.*$" }
            { node.name = "alsa_input.pci-0000_03_00.6.HiFi__Mic2__source" }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }
]
