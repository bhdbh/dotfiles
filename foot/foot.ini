[main]
font=scientifica:pixelsize=22:antialias=true,Symbols Nerd Font Mono:pixelsize=22,Noto Color Emoji:pixelsize=22
pad=6x6

[colors-dark]
# Tailwind CSS Zinc for neutrals; ANSI accents use normal 400 / bright 500.
foreground=d4d4d8
background=09090b
selection-foreground=fafafa
selection-background=3f3f46

# Black, error, success, warning, info, purple, cyan, white.
regular0=18181b
regular1=f87171
regular2=4ade80
regular3=fbbf24
regular4=60a5fa
regular5=c084fc
regular6=22d3ee
regular7=d4d4d8

# Bright ANSI accents use shade 500.
bright0=71717a
bright1=ef4444
bright2=22c55e
bright3=f59e0b
bright4=3b82f6
bright5=a855f7
bright6=06b6d4
bright7=fafafa
