# Seletores de arquivos dos aplicativos: Yazi em uma janela de diálogo do Foot.
for_window [app_id="^yazi-filechooser$"] floating enable, resize set width 1000 px height 650 px, move position center
for_window [app_id="^yazi-confirm$"] floating enable, move position center
exec_always @HOME@/.local/bin/sway-portals
