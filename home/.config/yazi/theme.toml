border_symbol = "│"
border_style = { fg = "#52525b" }

[indicator]
padding = { open = "▐", close = "▌" }
parent = { fg = "#71717a" }
current = { fg = "#fafafa", bold = true }
preview = { fg = "#71717a", underline = false }

[tabs]
sep_inner = { open = "▐", close = "▌" }
sep_outer = { open = "▐", close = "▌" }
active = { fg = "#18181b", bg = "#fafafa", bold = true }
inactive = { fg = "#a1a1aa", bg = "#27272a" }

[mode]
normal_main = { fg = "#18181b", bg = "#fafafa", bold = true }
normal_alt = { fg = "#fafafa", bg = "#3f3f46" }
select_main = { fg = "#18181b", bg = "#d4d4d8", bold = true }
select_alt = { fg = "#fafafa", bg = "#3f3f46" }
unset_main = { fg = "#fafafa", bg = "#52525b" }
unset_alt = { fg = "#a1a1aa", bg = "#27272a" }

[status]
sep_left = { open = "▐", close = "▌" }
sep_right = { open = "▐", close = "▌" }
overall = { fg = "#d4d4d8" }
perm_type = { fg = "#a1a1aa" }
perm_read = { fg = "#d4d4d8" }
perm_write = { fg = "#a1a1aa" }
perm_exec = { fg = "#fafafa" }
perm_sep = { fg = "#71717a" }
progress_label = { fg = "#fafafa" }
progress_normal = { fg = "#d4d4d8" }
progress_error = { fg = "#71717a" }

[filetype]
rules = [
    { url = "*/", fg = "#d4d4d8" },
    { url = "*", fg = "#fafafa" },
]

[which]
