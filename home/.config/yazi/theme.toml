[icon]
globs = []
dirs = []
files = []
exts = []
conds = [
    { if = "dir", text = "󰉋", fg = "#fafafa" },
]

[mgr]
cwd = { fg = "#fafafa", bold = true }
find_keyword = { fg = "#fafafa", bold = true }
find_position = { fg = "#a1a1aa" }
symlink_target = { fg = "#a1a1aa" }

marker_copied = { fg = "#d4d4d8" }
marker_cut = { fg = "#71717a" }
marker_marked = { fg = "#fafafa" }
marker_selected = { fg = "#fafafa" }

count_copied = { fg = "#18181b", bg = "#d4d4d8" }
count_cut = { fg = "#fafafa", bg = "#3f3f46" }
