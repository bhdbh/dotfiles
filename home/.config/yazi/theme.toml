list = { fg = "#fafafa" }
btn_yes = { fg = "#18181b", bg = "#d4d4d8" }
btn_no = { fg = "#fafafa", bg = "#3f3f46" }

[notify]
title_info = { fg = "#d4d4d8" }
title_warn = { fg = "#a1a1aa" }
title_error = { fg = "#fafafa" }

[input]
border = { fg = "#52525b" }
title = { fg = "#fafafa" }
value = { fg = "#fafafa" }
