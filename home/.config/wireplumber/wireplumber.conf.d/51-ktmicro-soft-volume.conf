# Keep headset playback gain independent from its USB hardware volume curve.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb---_KTMicro_--_Audio_hs_2.0_headset_2024-05-21-0000-0000-0000-00"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        # Set the playback mixer to the calibrated 0 dB on every activation.
        # soft-mixer alone leaves its power-on/reconnection value untouched.
        device.profile-set = "@HOME@/.config/alsa-card-profile/mixer/profile-sets/ktmicro-soft-volume.conf"
      }
    }
  }
]
