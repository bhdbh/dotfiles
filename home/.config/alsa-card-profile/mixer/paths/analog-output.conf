# Keep the standard route name so WirePlumber restores its saved volume.
.include /usr/share/alsa-card-profile/mixer/paths/analog-output.conf

# The volume curve was calibrated with PCM at 0 dB. Apply it when the
# route is activated, including boot, reconnection and profile changes.
# Volume and mute remain controlled in software by PipeWire.
[Element PCM]
volume = zero
switch = on
