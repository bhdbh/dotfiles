music_directory "@HOME@/Musics"
playlist_directory "@HOME@/.local/state/mpd/playlists"
db_file "@HOME@/.local/state/mpd/database"
state_file "@HOME@/.local/state/mpd/state"
sticker_file "@HOME@/.local/state/mpd/sticker.sql"

# A local socket also permits opening music outside the indexed library.
bind_to_address "@RUNTIME_DIR@/mpd/socket"
auto_update "yes"
restore_paused "yes"

audio_output {
    type "pipewire"
    name "PipeWire"
    mixer_type "software"
}
