# Initial workspace placement before the output watcher selects the primary.
set $desktop_monitor HDMI-A-1
output $desktop_monitor mode 1920x1080@143.981Hz
workspace 1 output $desktop_monitor eDP-1
workspace 2 output $desktop_monitor eDP-1
workspace 3 output $desktop_monitor eDP-1
workspace 4 output $desktop_monitor eDP-1
workspace 5 output $desktop_monitor eDP-1
workspace 6 output $desktop_monitor eDP-1
workspace 7 output $desktop_monitor eDP-1
workspace 8 output $desktop_monitor eDP-1
workspace 9 output $desktop_monitor eDP-1

# The supervised watcher is started by sway-session.service.
bindswitch --locked lid:toggle exec python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/outputs.py" --once
