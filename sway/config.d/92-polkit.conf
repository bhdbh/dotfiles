# Run the text agent in a terminal that belongs to Sway's login session.
set $polkit_terminal foot --app-id=sway-polkit-agent --title=Polkit /usr/bin/python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/polkit-agent.py"

for_window [app_id="^sway-polkit-agent$"] move scratchpad
exec $polkit_terminal
bindsym --no-repeat $mod+Shift+a exec swaymsg '[app_id="^sway-polkit-agent$"] scratchpad show, move position center' || $polkit_terminal
