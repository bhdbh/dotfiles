# Acer special-function keys; the firmware controls whether Fn is required.
# Numbered workspaces are limited to 1-9 in Quickshell.
unbindsym $mod+0
unbindsym $mod+Shift+0

# Hardware migration can preserve workspaces beyond 9. Cycle them natively
# without dropping windows or changing the nine creation buttons.
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output

bindsym --locked --no-repeat XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 2%-
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 2%+
bindsym --locked --no-repeat XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindsym --locked XF86MonBrightnessDown exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/brightness.sh" down
bindsym --locked XF86MonBrightnessUp exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/brightness.sh" up

bindsym --no-repeat XF86Display exec python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/outputs.py" --cycle-display
bindsym --no-repeat XF86DisplayToggle exec python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/outputs.py" --cycle-display
bindsym --no-repeat $mod+p exec python3 "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/outputs.py" --cycle-display

bindsym --locked --no-repeat XF86TouchpadToggle input type:touchpad events toggle enabled disabled
bindsym --locked --no-repeat XF86TouchpadOn input type:touchpad events enabled
bindsym --locked --no-repeat XF86TouchpadOff input type:touchpad events disabled

bindsym --no-repeat XF86ScreenSaver exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/lock.sh"
# The Acer lock key may send Win+L. Move the existing layout shortcut to Win+Shift+L.
bindsym --no-warn --no-repeat $mod+l exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/lock.sh"
bindsym $mod+Shift+l layout toggle split

# Trigger on press so key releases can still reach IBus.
bindsym --no-repeat Print exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/screenshot.sh" region
bindsym --no-repeat Shift+Print exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/screenshot.sh" output
bindsym --no-repeat XF86SelectiveScreenshot exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/screenshot.sh" region
bindsym --no-repeat $mod+s exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/screenshot.sh" region
bindsym --no-repeat $mod+Shift+s exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/screenshot.sh" output
bindsym --no-repeat $mod+r exec "${XDG_CONFIG_HOME:-$HOME/.config}/sway/scripts/record-screen.sh"

# The kernel's rfkill input handler already handles the airplane-mode key.
# Insert and the normal F1-F12 keys keep their native behavior.
