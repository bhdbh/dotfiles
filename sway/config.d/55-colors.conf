# Tailwind CSS Zinc, matching the Quickshell bar and wallpaper.
set $zinc50  #fafafa
set $zinc100 #f4f4f5
set $zinc200 #e4e4e7
set $zinc300 #d4d4d8
set $zinc400 #a1a1aa
set $zinc500 #71717a
set $zinc600 #52525b
set $zinc700 #3f3f46
set $zinc800 #27272a
set $zinc900 #18181b
set $zinc950 #09090b

# Class                  Border    Background Text      Indicator Child border
client.focused           $zinc50   $zinc50   $zinc950 $zinc400 $zinc50
client.focused_inactive  $zinc700  $zinc800  $zinc50  $zinc500 $zinc800
client.focused_tab_title $zinc700  $zinc800  $zinc50
client.unfocused         $zinc800  $zinc950  $zinc400 $zinc700 $zinc800
client.urgent            $zinc200  $zinc200  $zinc950 $zinc50  $zinc200
